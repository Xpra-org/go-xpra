name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Each backend is compiled only on its own platform, so both have to be
    # built to know that either still works.
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...
