name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    env:
      UPX_VERSION: "5.2.0"
      UPX_SHA256: "3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1"
    strategy:
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install UPX
        run: |
          archive="${RUNNER_TEMP}/upx.tar.xz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          echo "${UPX_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/upx-${UPX_VERSION}-amd64_linux" >> "${GITHUB_PATH}"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build dist
          go build -trimpath -ldflags="-s -w" -o build/go-xpra ./cmd/go-xpra
          upx --best --lzma build/go-xpra
          upx --test build/go-xpra
          tar -C build -czf "dist/go-xpra-linux-${GOARCH}.tar.gz" go-xpra

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: go-xpra-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: go-xpra-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum go-xpra-linux-*.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
