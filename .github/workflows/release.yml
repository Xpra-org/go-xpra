name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    env:
      UPX_VERSION: "5.2.0"
      UPX_SHA256: "3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1"
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install UPX
        run: |
          archive="${RUNNER_TEMP}/upx.tar.xz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          echo "${UPX_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/upx-${UPX_VERSION}-amd64_linux" >> "${GITHUB_PATH}"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build dist
          binary="go-xpra"
          if [ "${GOOS}" = "windows" ]; then
            binary="go-xpra.exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "build/${binary}" ./cmd/go-xpra
          upx --best --lzma "build/${binary}"
          upx --test "build/${binary}"
          # Each platform gets the archive its users can open without installing
          # anything.
          if [ "${GOOS}" = "windows" ]; then
            (cd build && zip -q "../dist/go-xpra-${GOOS}-${GOARCH}.zip" "${binary}")
          else
            tar -C build -czf "dist/go-xpra-${GOOS}-${GOARCH}.tar.gz" "${binary}"
          fi

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: go-xpra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/go-xpra-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: go-xpra-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum go-xpra-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
